# The acceptance suite against a containerised RouterOS. Run on request rather
# than on every change: it boots a router per version and takes tens of minutes,
# and the images available are older than the release this fork targets, so it
# complements the manual run against real hardware (see FORK.md) rather than
# replacing it.
name: Acceptance tests (container)
on:
  workflow_dispatch:
    inputs:
      routeros_version:
        description: 'RouterOS image to test against'
        required: true
        default: '7.16'
        type: choice
        options: ['7.12', '7.15', '7.16']

permissions:
  contents: read

env:
  # Newest patch of the Go 1.25 line. The standard library ships inside the
  # binary, so the toolchain patch level is a property of the release: pinning
  # an exact patch here would leave published archives linking a standard
  # library with known advisories until somebody edited this by hand. go.mod
  # records 1.25.12 as the floor that clears the currently known ones.
  GO_VERSION: '1.25.x'

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      matrix:
        experimental: [false]
        os: [ubuntu-latest]
        routeros_version:
          - ${{ inputs.routeros_version }}

    steps:
      - name: Container check
        run: |
          echo "Wait for the container to finish launching..."
          while true; do
            docker logs ${{ job.services.routeros.id }} 2>&1 | grep MikroTik && break
            # docker logs ${{ job.services.routeros.id }} 2>&1
            echo "waiting..."
            sleep 10
          done

      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Setup Go environment
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
        id: go  
  
      - name: Get dependencies
        run: | 
          go mod download

      - name: Build
        run: go build -v .

      - name: Preparing RouterOS for testing
        run: |
          go run ./tools/testenv
        env:
          ROS_USERNAME: admin
          ROS_PASSWORD: ''
          ROS_IP_ADDRESS: 127.0.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1

      - name: Run client tests
        run: go test -timeout 30m -v ./routeros
        env:
          ROS_HOSTURL: https://127.0.0.1
          ROS_USERNAME: admin
          ROS_PASSWORD: ''
          ROS_INSECURE: true
          TF_ACC: 1
          ROS_VERSION: ${{ matrix.routeros_version }}

    services:
      routeros:
        image: vaerhme/routeros:v${{ matrix.routeros_version }}
        ports:
          - 443:443
          - 8728:8728
          - 8729:8729
        options: >-
          --cap-add=NET_ADMIN
          --entrypoint /routeros/entrypoint_with_four_interfaces.sh
          --device /dev/net/tun
          --device /dev/kvm
