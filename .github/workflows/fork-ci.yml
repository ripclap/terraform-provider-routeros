# Checks that have to pass before a tag is worth pushing. No device is involved:
# the acceptance suite needs real hardware and is run by hand, see FORK.md.
name: CI

on:
  push:
    branches:
      - 'full-device-coverage'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: gofmt
        run: |
          unformatted="$(gofmt -l . | grep -v '^vendor/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt'd:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./routeros/

      - name: Unit tests
        # TF_ACC is unset, so the acceptance tests skip themselves.
        run: go test ./routeros/ -count=1

      # Builds every platform the release does, so a break specific to one of them
      # is caught here rather than half way through publishing. 386 is the one that
      # matters: a uint32 range in a validator overflows `int` there and nowhere else.
      - name: Build the release matrix
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean --skip=publish,sign

  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      # A schema change with no matching docs change leaves the registry describing
      # attributes that no longer exist.
      - name: Docs match the schemas
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs@latest \
            generate --provider-name routeros
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is stale, run tfplugindocs generate and commit the result"
            git diff --stat -- docs/
            exit 1
          fi
