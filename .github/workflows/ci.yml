# Every check that does not need a RouterOS device. A release re-runs this
# workflow against the tagged commit, so these checks also gate publishing.
name: CI

on:
  push:
    branches:
      - 'full-device-coverage'
    paths-ignore: &prose
      # docs/ is deliberately absent: it is generated from the schemas, so an
      # edit to it is what the docs check exists to catch.
      - 'README.md'
      - 'FORK.md'
      - 'CHANGELOG.md'
      - 'RELEASING.md'
      - 'CONTRIBUTING.md'
      - 'NOTICE'
      - 'LICENSE.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    paths-ignore: *prose
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Newest patch of the Go 1.25 line. The standard library ships inside the
  # binary, so the toolchain patch level is a property of the release: pinning
  # an exact patch here would leave published archives linking a standard
  # library with known advisories until somebody edited this by hand. go.mod
  # records 1.25.12 as the floor that clears the currently known ones.
  GO_VERSION: '1.25.x'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # Configured by .golangci.yml. Covers gofmt and go vet, so neither is run
      # separately.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      # Reports only vulnerabilities reachable from this code, rather than every
      # advisory affecting something in go.sum. Run from its own module so the
      # provider's dependency graph is unaffected.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails the pull request if it introduces a dependency with a known
      # vulnerability or a licence incompatible with MPL-2.0 redistribution.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: AGPL-3.0, GPL-2.0, GPL-3.0, LGPL-2.1, LGPL-3.0

  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Unit tests
        # TF_ACC is unset, so an acceptance test skips once it reaches
        # resource.Test. Two things run before that point: the version gates read
        # ROS_VERSION and fail outright when it is empty, so a value is supplied;
        # and testAccPreCheck wants a reachable router, so that one test is left
        # to the manual run against hardware.
        env:
          ROS_VERSION: 7.23.1
        run: go test ./routeros/ -count=1 -skip 'TestClientTransport_SendRequest'

      - name: Generated code is current
        # routeros/mikrotik_resource_drift.go is generated from the .yaml beside
        # it. Editing one without the other leaves the version-gated attribute
        # renames wrong, and RouterOS answers with an unknown-parameter error.
        run: |
          (cd routeros && go run ../tools/drift/main.go)
          if ! git diff --quiet -- routeros/mikrotik_resource_drift.go; then
            echo "::error::mikrotik_resource_drift.go is stale, regenerate it:"
            echo "::error::  cd routeros && go run ../tools/drift/main.go"
            git diff -- routeros/mikrotik_resource_drift.go
            exit 1
          fi

      - name: Coverage list is current
        run: |
          go run tools/coverage/main.go
          if ! git diff --quiet -- COVERAGE.md; then
            echo "::error::COVERAGE.md is stale, regenerate it:"
            echo "::error::  go run tools/coverage/main.go"
            git diff -- COVERAGE.md
            exit 1
          fi

      # tfplugindocs shells out to Terraform to export the provider schema. Left
      # to find its own it downloads one, checks the signature against a
      # HashiCorp key that has since expired, and fails. Putting a binary on
      # PATH skips that entirely.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Docs match the schemas
        run: |
          go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs \
            generate --provider-name routeros
          if ! git diff --quiet -- docs/; then
            echo "::error::docs/ is stale, regenerate it:"
            echo "::error::  go run github.com/hashicorp/terraform-plugin-docs/cmd/tfplugindocs generate --provider-name routeros"
            git diff --stat -- docs/
            exit 1
          fi

  # Compiling all thirteen release targets takes around six minutes, which is
  # most of this workflow. A pull request gets a representative subset instead:
  # one target per OS, plus 386, which is the one that catches people out
  # because a uint32 range in a validator overflows int there and nowhere else.
  # The full matrix still runs on every push to the branch, and again against
  # the tagged commit before a release is signed.
  crossbuild:
    name: Cross-compile
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Compile a target per OS, and 386
        run: |
          set -uo pipefail
          fail=0
          for target in linux/amd64 linux/386 darwin/arm64 windows/amd64 freebsd/amd64; do
            if ! GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null . ; then
              echo "::error::build failed for ${target}"
              fail=1
            fi
          done
          exit "$fail"

  build:
    name: Build every release platform
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # The same build a release performs, minus signing and uploading, so a
      # break confined to one platform surfaces here rather than part way
      # through publishing.
      - name: GoReleaser (snapshot)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --snapshot --clean --skip=publish,sign,sbom

      - name: Summarise
        run: |
          {
            echo "### Snapshot build"
            echo
            echo "| archive | bytes |"
            echo "|---|--:|"
            for f in dist/*.zip; do
              printf '| %s | %s |\n' "$(basename "$f")" "$(stat -c%s "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Unsigned, and not what a release publishes, but enough to install from a
      # filesystem mirror and try against a device before tagging anything.
      - name: Keep the archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: snapshot-${{ github.sha }}
          path: dist/*.zip
          retention-days: 7
          compression-level: 0
