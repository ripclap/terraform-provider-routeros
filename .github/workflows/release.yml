# Turns a tag into a draft release, signed and attested. Publishing the draft is
# a separate manual act and is the only way a version reaches the registry.
# Registry versions are immutable once published; see RELEASING.md.
#
# Requires the repository secrets GPG_PRIVATE_KEY and GPG_PASSPHRASE, and the
# repository variable GPG_FINGERPRINT.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Re-run against a tag that already exists - pick the tag, not a branch, in the
  # "Use workflow from" dropdown.
  workflow_dispatch:

concurrency:
  # Never cancel a release part way through; a half uploaded draft is confusing
  # to reason about and there is no hurry.
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Newest patch of the Go 1.25 line. The standard library ships inside the
  # binary, so the toolchain patch level is a property of the release: pinning
  # an exact patch here would leave published archives linking a standard
  # library with known advisories until somebody edited this by hand. go.mod
  # records 1.25.12 as the floor that clears the currently known ones.
  GO_VERSION: '1.25.x'

jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.checks.outputs.version }}
      draft_exists: ${{ steps.checks.outputs.draft_exists }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_BRANCH: full-device-coverage
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Check the tag can be released
        id: checks
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::run this from a tag, not '${TAG}'. In \"Run workflow\" the" \
                 "\"Use workflow from\" dropdown lists tags as well as branches."
            exit 1
          fi

          # 1. A version number we can reason about, and that goreleaser and the
          #    registry will agree on.
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$TAG' is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # 2. The tag has to be on the release branch. A tag pushed from a stale
          #    clone is the easy way to publish code nobody reviewed.
          git fetch --no-tags origin "$RELEASE_BRANCH"
          if ! git merge-base --is-ancestor "${TAG}^{commit}" "origin/${RELEASE_BRANCH}"; then
            echo "::error::${TAG} is not an ancestor of origin/${RELEASE_BRANCH};" \
                 "it points at $(git rev-parse --short "${TAG}^{commit}")"
            exit 1
          fi

          # 3. The registry is the one place nothing can be undone. Ask it first.
          NS="${GITHUB_REPOSITORY_OWNER}"
          NAME="${GITHUB_REPOSITORY#*/terraform-provider-}"
          PUBLISHED="$(curl -fsS --retry 3 \
            "https://registry.opentofu.org/v1/providers/${NS}/${NAME}/versions" \
            2>/dev/null || echo '{"versions":[]}')"
          if echo "$PUBLISHED" | jq -e --arg v "$VERSION" \
               '(.versions // []) | map(.version) | index($v)' >/dev/null; then
            echo "::error::${VERSION} is already in the OpenTofu registry. Its" \
                 "checksums are recorded and cannot be changed; rebuilding it" \
                 "would break every install of that version. Tag the next patch" \
                 "version instead."
            exit 1
          fi

          # 4. Same question of GitHub. A draft is fine - that is the point of
          #    drafts - but a published release is finished.
          DRAFT=false
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" = "true" ]; then
              DRAFT=true
              echo "::notice::a draft of ${TAG} exists and will be replaced"
            else
              echo "::error::${TAG} is already published on GitHub. Its files are" \
                   "what the registry will fetch; replacing them breaks installs." \
                   "Tag the next patch version instead."
              exit 1
            fi
          fi
          echo "draft_exists=$DRAFT" >> "$GITHUB_OUTPUT"

          # 5. Cheap quality gates that are annoying to notice after the fact.
          if ! grep -qE "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${VERSION}]' heading"
            exit 1
          fi
          jq -e '.metadata.protocol_versions | length > 0' \
            terraform-registry-manifest.json > /dev/null

          echo "### Preflight" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${TAG}\` -> version \`${VERSION}\`, commit \`$(git rev-parse --short "${TAG}^{commit}")\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Not yet in the registry, not yet published on GitHub, on \`${RELEASE_BRANCH}\`, changelogged." >> "$GITHUB_STEP_SUMMARY"

  # The same checks the branch gets, run again against the tagged commit. CI
  # having been green on the branch says nothing about the commit being tagged.
  checks:
    name: Checks
    needs: preflight
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build, sign, draft
    needs: [preflight, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance attestation is signed with a short-lived OIDC identity.
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      # Leaves the tag alone, so the rebuild is of the same commit.
      - name: Discard the previous draft
        if: needs.preflight.outputs.draft_exists == 'true'
        run: gh release delete "${GITHUB_REF_NAME}" --yes

      - name: Import the signing key
        id: gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Check it is the expected key
        # The registry verifies against the public key registered for the
        # namespace. Signing with any other key produces a release it will not
        # accept, which is only discovered once the version is already published.
        env:
          EXPECTED: ${{ vars.GPG_FINGERPRINT }}
          ACTUAL: ${{ steps.gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED" ]; then
            echo "::warning::set the repository variable GPG_FINGERPRINT to $ACTUAL" \
                 "to have this checked automatically"
          elif [ "${EXPECTED^^}" != "${ACTUAL^^}" ]; then
            echo "::error::signing key is $ACTUAL, expected $EXPECTED"
            exit 1
          fi
          echo "signing with $ACTUAL"

      # Produces the CycloneDX documents named in .goreleaser.yml.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.gpg.outputs.fingerprint }}
          # Pinned rather than derived: `git describe` is ambiguous when more
          # than one tag points at the same commit.
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: The signature verifies
        run: gpg --verify dist/*_SHA256SUMS.sig dist/*_SHA256SUMS

      # The GPG signature proves who signed the checksums. This proves which
      # workflow, repository and commit produced the archives, which a signature
      # cannot. Verified with:
      #   gh attestation verify <archive> --repo <owner>/<repo>
      - name: Attest the archives
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-path: dist/*.zip

  verify:
    name: Verify the draft
    needs: [preflight, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Checks what actually landed on the release rather than what the build
      # believes it produced, so a truncated or missing upload is caught here.
      - name: Download the draft's files
        run: gh release download "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --dir dist

      - name: Checksums match
        working-directory: dist
        run: sha256sum -c ./*_SHA256SUMS

      - name: Nothing is missing
        working-directory: dist
        run: |
          set -euo pipefail
          missing=0
          for want in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 linux_386; do
            ls ./*_"${want}".zip >/dev/null 2>&1 || { echo "::error::no archive for ${want}"; missing=1; }
          done
          ls ./*_manifest.json >/dev/null 2>&1 || { echo "::error::no registry manifest"; missing=1; }
          ls ./*_SHA256SUMS.sig >/dev/null 2>&1 || { echo "::error::no signature"; missing=1; }

          # One SBOM per archive, or the inventory is incomplete for some platform.
          archives=$(ls ./*.zip | wc -l)
          sboms=$(ls ./*.sbom.json 2>/dev/null | wc -l)
          if [ "$archives" -ne "$sboms" ]; then
            echo "::error::${archives} archives but ${sboms} SBOMs"
            missing=1
          fi

          [ "$missing" -eq 0 ]
          echo "${archives} archives, ${sboms} SBOMs, checksums and signature present"

      - name: What to do next
        run: |
          {
            echo "### ${GITHUB_REF_NAME} is built and waiting as a draft"
            echo
            echo "$(ls dist/*.zip | wc -l) archives, all checksums verified against the signed manifest."
            echo
            echo "It is **not installable yet**. Look it over, then publish it:"
            echo
            echo "<${{ github.server_url }}/${{ github.repository }}/releases>"
            echo
            echo "Publishing is final. The registry records these exact files, and"
            echo "a version cannot be rebuilt afterwards - the next fix is the next"
            echo "version. If something is wrong, delete the draft and re-run this"
            echo "workflow instead."
          } >> "$GITHUB_STEP_SUMMARY"
