# Builds, signs and publishes a release when a version tag is pushed.
#
# Two repository secrets are required:
#   GPG_PRIVATE_KEY - ASCII armoured private key, `gpg --armor --export-secret-keys <id>`
#   GPG_PASSPHRASE  - the passphrase for that key
#
# It has to be the key whose public half is registered for this namespace in the
# OpenTofu Registry, otherwise the registry rejects the signature and the version
# never appears.
name: Release (tag)

on:
  push:
    tags:
      - 'v*'
  # Re-run against a tag that already exists, for example after fixing a secret.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v2.0.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          # Pinned explicitly: `git describe` is ambiguous when more than one tag
          # points at the same commit.
          GORELEASER_CURRENT_TAG: ${{ inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
