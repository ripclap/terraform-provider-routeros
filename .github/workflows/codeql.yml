# Static application security testing. Results appear under the repository's
# Security tab and on pull requests.
name: CodeQL

on:
  push:
    branches:
      - 'full-device-coverage'
  pull_request:
    branches:
      - 'full-device-coverage'
  schedule:
    # Weekly, so a newly published query reaches this code without waiting for
    # the next push.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pin to the first patched release after GO-2026-6603/6605/6607/6608.
  # setup-go resolved 1.26.x to 1.26.8 in CI, which fails govulncheck.
  GO_VERSION: '1.26.9'

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: go
          # security-extended adds lower-severity queries the default suite
          # leaves out; the noise is manageable at this size.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4

      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: /language:go
