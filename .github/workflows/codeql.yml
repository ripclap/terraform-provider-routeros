# Static application security testing. Results appear under the repository's
# Security tab and on pull requests.
name: CodeQL

on:
  push:
    branches:
      - 'full-device-coverage'
  pull_request:
    branches:
      - 'full-device-coverage'
  schedule:
    # Weekly, so a newly published query reaches this code without waiting for
    # the next push.
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Newest patch of the Go 1.25 line. The standard library ships inside the
  # binary, so the toolchain patch level is a property of the release: pinning
  # an exact patch here would leave published archives linking a standard
  # library with known advisories until somebody edited this by hand. go.mod
  # records 1.25.12 as the floor that clears the currently known ones.
  GO_VERSION: '1.25.x'

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: go
          # security-extended adds lower-severity queries the default suite
          # leaves out; the noise is manageable at this size.
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@5595ccaf912efad79be6eef63a5619ff05969be3 # v4

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: /language:go
