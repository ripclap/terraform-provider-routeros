version: 2
before:
  hooks:
    # Verify rather than tidy: a release build must not be able to change
    # dependency resolution after CI has validated it.
    - go mod verify
builds:
  - env:
      # CGO is disabled so the archives are usable in environments that cannot
      # install libraries, such as Terraform Cloud.
      - CGO_ENABLED=0
    mod_timestamp: "{{ .CommitTimestamp }}"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{.Version}} -X main.commit={{.Commit}}"
    goos:
      - freebsd
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ignore:
      - goos: darwin
        goarch: "386"
    binary: "{{ .ProjectName }}_v{{ .Version }}"
archives:
  - formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_SHA256SUMS"
  algorithm: sha256
signs:
  # The registry verifies this signature over the checksum file, which in turn
  # covers every archive.
  - artifacts: checksum
    args:
      - "--batch" # non-interactive: there is no tty in CI
      - "--local-user"
      - "{{ .Env.GPG_FINGERPRINT }}"
      - "--output"
      - "${signature}"
      - "--detach-sign"
      - "${artifact}"
sboms:
  # CycloneDX inventory of what went into each archive, published alongside it.
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"
    args: ["$artifact", "--output", "cyclonedx-json=$document"]
release:
  # Upload to a draft, so the archives can be looked at before anyone can install
  # them. The registry only sees a version once the draft is published, and until
  # then a bad build can be thrown away and the same version built again.
  draft: true
  prerelease: auto
  extra_files:
    # The Terraform Registry requires the manifest as a release asset.
    - glob: terraform-registry-manifest.json
      name_template: "{{ .ProjectName }}_{{ .Version }}_manifest.json"
